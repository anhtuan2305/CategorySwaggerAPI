spring.application.name=CategorySwaggerAPI

server.port=8083

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=CategorySwaggerDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=anhtuan
spring.datasource.password=DB_PASSWORD
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

storage.location=uploads/categories

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs