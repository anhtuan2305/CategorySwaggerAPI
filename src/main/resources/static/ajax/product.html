<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Quản lý Product</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        body {
            background-color: #f4f6f9;
        }

        .main-container {
            max-width: 1600px;
            margin: 40px auto;
        }

        .product-image {
            width: 75px;
            height: 75px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #dee2e6;
        }

        .no-image {
            width: 75px;
            height: 75px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #e9ecef;
            border-radius: 8px;
            color: #6c757d;
            font-size: 25px;
        }

        .table td,
        .table th {
            vertical-align: middle;
        }

        #messageAlert {
            display: none;
        }

        .description-cell {
            max-width: 250px;
            white-space: normal;
        }
    </style>
</head>

<body>

<div class="container-fluid main-container px-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h1 class="fw-bold">Quản lý Product</h1>
            <p class="text-secondary fs-5 mb-0">
                RESTful API kết hợp AJAX
            </p>
        </div>

        <div>
            <a href="/ajax/category.html"
               class="btn btn-outline-secondary btn-lg me-2">

                <i class="fa-solid fa-list"></i>
                Category
            </a>

            <button class="btn btn-primary btn-lg"
                    data-bs-toggle="modal"
                    data-bs-target="#addProductModal">

                <i class="fa-solid fa-plus"></i>
                Thêm Product
            </button>
        </div>

    </div>

    <div id="messageAlert"
         class="alert alert-dismissible fade show"
         role="alert">

        <span id="messageText"></span>

        <button type="button"
                class="btn-close"
                onclick="hideAlert()">
        </button>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-4">

            <div class="table-responsive">

                <table class="table table-hover">

                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Ảnh</th>
                        <th>Tên Product</th>
                        <th>Category</th>
                        <th>Giá</th>
                        <th>Số lượng</th>
                        <th>Giảm giá</th>
                        <th>Trạng thái</th>
                        <th>Mô tả</th>
                        <th>Thao tác</th>
                    </tr>
                    </thead>

                    <tbody id="productTableBody">
                    <tr>
                        <td colspan="10"
                            class="text-center text-secondary py-4">
                            Đang tải dữ liệu...
                        </td>
                    </tr>
                    </tbody>

                </table>

            </div>

        </div>
    </div>

</div>

<!-- Modal thêm Product -->
<div class="modal fade"
     id="addProductModal"
     tabindex="-1">

    <div class="modal-dialog modal-lg">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Thêm Product</h5>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                </button>
            </div>

            <form id="addProductForm"
                  enctype="multipart/form-data">

                <div class="modal-body">

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label class="form-label">
                                Tên Product
                            </label>

                            <input type="text"
                                   class="form-control"
                                   name="productName"
                                   required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">
                                Category
                            </label>

                            <select class="form-select"
                                    id="addCategoryId"
                                    name="categoryId"
                                    required>

                                <option value="">
                                    Chọn Category
                                </option>
                            </select>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">
                                Số lượng
                            </label>

                            <input type="number"
                                   class="form-control"
                                   name="quantity"
                                   value="0"
                                   min="0"
                                   required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">
                                Đơn giá
                            </label>

                            <input type="number"
                                   class="form-control"
                                   name="unitPrice"
                                   value="0"
                                   min="0"
                                   step="0.01"
                                   required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">
                                Giảm giá (%)
                            </label>

                            <input type="number"
                                   class="form-control"
                                   name="discount"
                                   value="0"
                                   min="0"
                                   max="100"
                                   step="0.01">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">
                                Trạng thái
                            </label>

                            <select class="form-select"
                                    name="status">

                                <option value="1">
                                    Đang hoạt động
                                </option>

                                <option value="0">
                                    Ngừng hoạt động
                                </option>
                            </select>
                        </div>

                        <div class="col-12 mb-3">
                            <label class="form-label">
                                Mô tả
                            </label>

                            <textarea class="form-control"
                                      name="description"
                                      rows="3"
                                      required></textarea>
                        </div>

                        <div class="col-12 mb-3">
                            <label class="form-label">
                                Ảnh sản phẩm
                            </label>

                            <input type="file"
                                   class="form-control"
                                   name="image"
                                   accept="image/*">
                        </div>

                    </div>

                </div>

                <div class="modal-footer">

                    <button type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal">
                        Đóng
                    </button>

                    <button type="submit"
                            id="addButton"
                            class="btn btn-primary">

                        <i class="fa-solid fa-floppy-disk"></i>
                        Lưu
                    </button>

                </div>

            </form>

        </div>
    </div>
</div>

<!-- Modal sửa Product -->
<div class="modal fade"
     id="editProductModal"
     tabindex="-1">

    <div class="modal-dialog modal-lg">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Sửa Product</h5>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                </button>
            </div>

            <form id="editProductForm"
                  enctype="multipart/form-data">

                <div class="modal-body">

                    <input type="hidden"
                           id="editProductId"
                           name="productId">

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label class="form-label">
                                Tên Product
                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="editProductName"
                                   name="productName"
                                   required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">
                                Category
                            </label>

                            <select class="form-select"
                                    id="editCategoryId"
                                    name="categoryId"
                                    required>

                                <option value="">
                                    Chọn Category
                                </option>
                            </select>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">
                                Số lượng
                            </label>

                            <input type="number"
                                   class="form-control"
                                   id="editQuantity"
                                   name="quantity"
                                   min="0"
                                   required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">
                                Đơn giá
                            </label>

                            <input type="number"
                                   class="form-control"
                                   id="editUnitPrice"
                                   name="unitPrice"
                                   min="0"
                                   step="0.01"
                                   required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">
                                Giảm giá (%)
                            </label>

                            <input type="number"
                                   class="form-control"
                                   id="editDiscount"
                                   name="discount"
                                   min="0"
                                   max="100"
                                   step="0.01">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">
                                Trạng thái
                            </label>

                            <select class="form-select"
                                    id="editStatus"
                                    name="status">

                                <option value="1">
                                    Đang hoạt động
                                </option>

                                <option value="0">
                                    Ngừng hoạt động
                                </option>
                            </select>
                        </div>

                        <div class="col-12 mb-3">
                            <label class="form-label">
                                Mô tả
                            </label>

                            <textarea class="form-control"
                                      id="editDescription"
                                      name="description"
                                      rows="3"
                                      required></textarea>
                        </div>

                        <div class="col-md-4 mb-3">
                            <label class="form-label">
                                Ảnh hiện tại
                            </label>

                            <div id="currentProductImage"></div>
                        </div>

                        <div class="col-md-8 mb-3">
                            <label class="form-label">
                                Chọn ảnh mới
                            </label>

                            <input type="file"
                                   class="form-control"
                                   id="editImage"
                                   name="image"
                                   accept="image/*">

                            <small class="text-secondary">
                                Không chọn ảnh nếu muốn giữ ảnh hiện tại.
                            </small>
                        </div>

                    </div>

                </div>

                <div class="modal-footer">

                    <button type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal">
                        Đóng
                    </button>

                    <button type="submit"
                            id="updateButton"
                            class="btn btn-warning">

                        <i class="fa-solid fa-floppy-disk"></i>
                        Cập nhật
                    </button>

                </div>

            </form>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<script src="https://code.jquery.com/jquery-3.7.1.min.js">
</script>

<script>
    let productList = [];

    $(document).ready(function () {
        loadCategories();
        loadProducts();
    });

    function getResponseArray(response) {
        if (Array.isArray(response)) {
            return response;
        }

        if (response && Array.isArray(response.body)) {
            return response.body;
        }

        if (response && Array.isArray(response.data)) {
            return response.data;
        }

        return [];
    }

    function loadCategories() {
        $.ajax({
            url: "/api/category?_=" + Date.now(),
            type: "GET",
            cache: false,

            success: function (response) {
                const categories = getResponseArray(response);

                const addSelect = $("#addCategoryId");
                const editSelect = $("#editCategoryId");

                addSelect.html(
                    '<option value="">Chọn Category</option>'
                );

                editSelect.html(
                    '<option value="">Chọn Category</option>'
                );

                categories.forEach(function (category) {
                    const option = `
                        <option value="${category.categoryId}">
                            ${escapeHtml(category.categoryName)}
                        </option>
                    `;

                    addSelect.append(option);
                    editSelect.append(option);
                });
            },

            error: function (xhr) {
                console.error(xhr.responseText);

                showAlert(
                    "Không thể tải danh sách Category.",
                    "danger"
                );
            }
        });
    }

    function loadProducts() {
        $("#productTableBody").html(`
            <tr>
                <td colspan="10"
                    class="text-center text-secondary py-4">
                    Đang tải dữ liệu...
                </td>
            </tr>
        `);

        $.ajax({
            url: "/api/product?_=" + Date.now(),
            type: "GET",
            cache: false,

            success: function (response) {
                productList = getResponseArray(response);
                renderProducts(productList);
            },

            error: function (xhr) {
                console.error(xhr.responseText);

                $("#productTableBody").html(`
                    <tr>
                        <td colspan="10"
                            class="text-center text-danger py-4">
                            Không thể tải danh sách Product.
                        </td>
                    </tr>
                `);
            }
        });
    }

    function renderProducts(products) {
        const tableBody = $("#productTableBody");
        tableBody.empty();

        if (!products || products.length === 0) {
            tableBody.html(`
                <tr>
                    <td colspan="10"
                        class="text-center text-secondary py-4">
                        Chưa có Product nào.
                    </td>
                </tr>
            `);

            return;
        }

        products.forEach(function (product) {
            const statusHtml =
                Number(product.status) === 1
                    ? '<span class="badge bg-success">Hoạt động</span>'
                    : '<span class="badge bg-secondary">Ngừng</span>';

            tableBody.append(`
                <tr>
                    <td>${product.productId}</td>

                    <td>
                        ${getImageHtml(product.images)}
                    </td>

                    <td>
                        ${escapeHtml(product.productName || "")}
                    </td>

                    <td>
                        ${escapeHtml(product.categoryName || "")}
                    </td>

                    <td>
                        ${formatMoney(product.unitPrice)}
                    </td>

                    <td>${product.quantity ?? 0}</td>

                    <td>${product.discount ?? 0}%</td>

                    <td>${statusHtml}</td>

                    <td class="description-cell">
                        ${escapeHtml(product.description || "")}
                    </td>

                    <td class="text-nowrap">

                        <button class="btn btn-warning btn-sm me-1"
                                onclick="openEditModal(${product.productId})">

                            <i class="fa-solid fa-pen-to-square"></i>
                            Sửa
                        </button>

                        <button class="btn btn-danger btn-sm"
                                onclick="deleteProduct(${product.productId})">

                            <i class="fa-solid fa-trash"></i>
                            Xóa
                        </button>

                    </td>
                </tr>
            `);
        });
    }

    $("#addProductForm").on("submit", function (event) {
        event.preventDefault();

        const form = this;
        const formData = new FormData(form);
        const button = $("#addButton");

        setButtonLoading(button, "Đang lưu...");

        $.ajax({
            url: "/api/product/addProduct",
            type: "POST",
            data: formData,
            processData: false,
            contentType: false,

            success: function (response) {
                bootstrap.Modal
                    .getOrCreateInstance(
                        document.getElementById("addProductModal")
                    )
                    .hide();

                form.reset();

                showAlert(
                    response.message || "Thêm Product thành công.",
                    "success"
                );

                loadProducts();
            },

            error: function (xhr) {
                showAlert(
                    getErrorMessage(xhr, "Thêm Product thất bại."),
                    "danger"
                );
            },

            complete: function () {
                resetButton(
                    button,
                    '<i class="fa-solid fa-floppy-disk"></i> Lưu'
                );
            }
        });
    });

    function openEditModal(productId) {
        const product = productList.find(function (item) {
            return Number(item.productId) === Number(productId);
        });

        if (!product) {
            showAlert("Không tìm thấy Product.", "danger");
            return;
        }

        $("#editProductId").val(product.productId);
        $("#editProductName").val(product.productName);
        $("#editCategoryId").val(product.categoryId);
        $("#editQuantity").val(product.quantity);
        $("#editUnitPrice").val(product.unitPrice);
        $("#editDiscount").val(product.discount);
        $("#editStatus").val(product.status);
        $("#editDescription").val(product.description);
        $("#editImage").val("");

        $("#currentProductImage").html(
            getImageHtml(product.images)
        );

        bootstrap.Modal
            .getOrCreateInstance(
                document.getElementById("editProductModal")
            )
            .show();
    }

    $("#editProductForm").on("submit", function (event) {
        event.preventDefault();

        const formData = new FormData(this);
        const button = $("#updateButton");

        setButtonLoading(button, "Đang cập nhật...");

        $.ajax({
            url: "/api/product/updateProduct",
            type: "PUT",
            data: formData,
            processData: false,
            contentType: false,

            success: function (response) {
                bootstrap.Modal
                    .getOrCreateInstance(
                        document.getElementById("editProductModal")
                    )
                    .hide();

                showAlert(
                    response.message || "Cập nhật Product thành công.",
                    "success"
                );

                loadProducts();
            },

            error: function (xhr) {
                showAlert(
                    getErrorMessage(xhr, "Cập nhật Product thất bại."),
                    "danger"
                );
            },

            complete: function () {
                resetButton(
                    button,
                    '<i class="fa-solid fa-floppy-disk"></i> Cập nhật'
                );
            }
        });
    });

    function deleteProduct(productId) {
        if (!confirm("Bạn có chắc muốn xóa Product này không?")) {
            return;
        }

        $.ajax({
            url: "/api/product/deleteProduct?productId="
                + encodeURIComponent(productId),

            type: "DELETE",

            success: function (response) {
                showAlert(
                    response.message || "Xóa Product thành công.",
                    "success"
                );

                loadProducts();
            },

            error: function (xhr) {
                showAlert(
                    getErrorMessage(xhr, "Xóa Product thất bại."),
                    "danger"
                );
            }
        });
    }

    function getImageHtml(filename) {
        if (!filename) {
            return `
                <div class="no-image">
                    <i class="fa-regular fa-image"></i>
                </div>
            `;
        }

        return `
            <img src="/api/product/files/${encodeURIComponent(filename)}?_=${Date.now()}"
                 class="product-image"
                 alt="Product"
                 onerror="showDefaultImage(this)">
        `;
    }

    function showDefaultImage(image) {
        image.parentElement.innerHTML = `
            <div class="no-image">
                <i class="fa-regular fa-image"></i>
            </div>
        `;
    }

    function formatMoney(value) {
        return Number(value || 0).toLocaleString(
            "vi-VN",
            {
                style: "currency",
                currency: "VND"
            }
        );
    }

    function setButtonLoading(button, text) {
        button.prop("disabled", true);
        button.text(text);
    }

    function resetButton(button, html) {
        button.prop("disabled", false);
        button.html(html);
    }

    function showAlert(message, type) {
        const alertBox = $("#messageAlert");

        alertBox.removeClass(
            "alert-success alert-danger alert-warning alert-info"
        );

        alertBox.addClass("alert-" + type);
        $("#messageText").text(message);
        alertBox.stop(true, true).fadeIn();

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

        setTimeout(function () {
            alertBox.fadeOut();
        }, 4000);
    }

    function hideAlert() {
        $("#messageAlert").hide();
    }

    function getErrorMessage(xhr, defaultMessage) {
        console.error(xhr.responseText);

        if (xhr.responseJSON &&
            xhr.responseJSON.message) {
            return xhr.responseJSON.message;
        }

        return defaultMessage;
    }

    function escapeHtml(value) {
        return $("<div>").text(value).html();
    }
</script>

</body>
</html>
