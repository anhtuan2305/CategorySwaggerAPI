<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Quản lý Category bằng AJAX</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        rel="stylesheet">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1>Quản lý Category</h1>
            <p class="text-secondary mb-0">
                Hiển thị dữ liệu bằng RESTful API và AJAX
            </p>
        </div>
    </div>

    <div id="message"></div>

    <div class="card shadow-sm">
        <div class="card-body">

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Icon</th>
                        <th>Tên Category</th>
                        <th>Thao tác</th>
                    </tr>
                    </thead>

                    <tbody id="categoryTableBody">
                    </tbody>
                </table>
            </div>

        </div>
    </div>
</div>

<script>
    $(document).ready(function () {
        loadCategories();
    });

    function loadCategories() {
        $.ajax({
            url: "/api/category",
            type: "GET",
            dataType: "json",

            success: function (categories) {
                let rows = "";

                $.each(categories, function (index, category) {
                    let imageHtml = '<span class="text-secondary">Không có ảnh</span>';

                    if (category.icon) {
                        imageHtml =
                            '<img src="/api/category/files/' +
                            encodeURIComponent(category.icon) +
                            '" width="70" height="70" ' +
                            'class="rounded object-fit-cover" alt="Category icon">';
                    }

                    rows += `
                        <tr>
                            <td>${category.categoryId}</td>
                            <td>${imageHtml}</td>
                            <td>${escapeHtml(category.categoryName)}</td>
                            <td>
                                <button class="btn btn-warning btn-sm"
                                        type="button">
                                    <i class="fa-solid fa-pen-to-square"></i>
                                    Sửa
                                </button>

                                <button class="btn btn-danger btn-sm"
                                        type="button">
                                    <i class="fa-solid fa-trash"></i>
                                    Xóa
                                </button>
                            </td>
                        </tr>
                    `;
                });

                $("#categoryTableBody").html(rows);
            },

            error: function (xhr) {
                $("#message").html(`
                    <div class="alert alert-danger">
                        Không thể tải danh sách Category.
                        Mã lỗi: ${xhr.status}
                    </div>
                `);
            }
        });
    }

    function escapeHtml(value) {
        return $("<div>").text(value ?? "").html();
    }
</script>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
